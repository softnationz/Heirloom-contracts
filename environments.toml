# Network configurations for Heirloom-Protocol contract deployment.
# Populated/updated automatically by scripts/deploy_testnet.sh and
# scripts/deploy_mainnet.sh via scripts/deploy_utils.sh. `contract_ttl_vault`
# must remain the first key under each section header - deploy_utils.sh
# parses it positionally.

[testnet]
contract_ttl_vault = "<your-contract-id>"
rpc_url = "https://soroban-testnet.stellar.org"
network_passphrase = "Test SDF Network ; September 2015"

[mainnet]
contract_ttl_vault = "<your-contract-id>"
rpc_url = "https://soroban-rpc.mainnet.stellar.org"
network_passphrase = "Public Global Stellar Network ; September 2015"

[futurenet]
contract_ttl_vault = "<your-contract-id>"
rpc_url = "https://rpc-futurenet.stellar.org"
network_passphrase = "Test SDF Future Network ; October 2022"

[standalone]
contract_ttl_vault = "<your-contract-id>"
rpc_url = "http://localhost:8000/soroban/rpc"
network_passphrase = "Standalone Network ; February 2017"
